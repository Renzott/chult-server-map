<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas Hexagons</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: lightgrey;
        overflow: hidden;
        min-height: 100%;
        font-family: "Roboto", sans-serif;
      }

      .wrap {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: black;
        overflow: hidden;
      }

      #canvas,
      #cursorCanvas {
        position: absolute;
      }

      #canvas {
        z-index: 1;
        border: 1px solid black;
        background-color: transparent;
      }

      #cursorCanvas {
        z-index: 100;
      }

      .fullscreen-container {
        position: fixed;
        display: flex;
        justify-content: center;
        align-items: center;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 1);
        z-index: 1000;
        transition: opacity 0.5s;
      }

      .loading {
        width: 100px;
        height: 100px;
        border: 16px solid #f3f3f3;
        border-top: 16px solid #3498db;
        border-radius: 50%;
        animation: spin 2s linear infinite;
      }

      .controls-container {
        position: fixed;
        display: flex;
        justify-content: start;
        align-items: center;
        top: 10px;
        left: 10px;
        gap: 10px;
        z-index: 1000;
      }

      .controls-hover-container {
        position: absolute;
        display: flex;
        justify-content: center;
        align-items: center;
        bottom: -88px;
        transition: bottom 0.2s;
        left: 50%;
        transform: translateX(-50%);
        gap: 10px;
        z-index: 1000;
        background-color: transparent;
        padding: 40px;
      }

      .controls-hover-container:hover {
        bottom: -20px;
      }

      .controls-bar {
        display: flex;
        gap: 10px;
        background-color: rgb(31, 30, 30);
        padding: 10px;
        padding-left: 15px;
        padding-right: 15px;
        border-radius: 10px;
      }

      .toolbar-button {
        background-color: #ff9900;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        padding: 10px;
        z-index: 2000;
      }

      #player-id {
        color: rgb(0, 0, 0);
        font-weight: 700;
        -webkit-text-stroke: 0.6px white;
        font-size: 24px;
        text-align: top;
        pointer-events: none;
      }

      .button {
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        padding: 10px;
        opacity: 0.2;
        transition: opacity 0.3s;
        z-index: 2000;
      }

      .player-button {
        width: 40px !important;
        background-color: #00790e;
      }

      .master-button {
        width: 40px !important;
        background-color: #fb9119;
      }

      .center-button {
        background-color: #0777ff;
      }

      .chip-status {
        position: absolute;
        top: 10px;
        right: 10px;
        background-color: rgb(31, 30, 30);
        color: white;
        padding: 6px;
        border-radius: 10px;
        padding-left: 10px;
        padding-right: 10px;
        border-radius: 5px;
        z-index: 2000;
        display: flex;
        gap: 8px;
        justify-content: center;
        align-items: center;
      }

      .circle-status {
        background-color: #2efd00;
        color: white;
        padding: 5px;
        border-radius: 50%;
        z-index: 2000;
        width: 5px;
        height: 5px;
      }

      .chip-status-text {
        font-size: 16px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <link rel="icon" href="./favicon.svg" sizes="any" type="image/svg+xml" />
  </head>
  <body>
    <div class="container">
      <div class="wrap">
        <div class="fullscreen-container">
          <div class="loading"></div>
        </div>
        <canvas id="cursorCanvas" class="panzoom2"></canvas>
        <canvas id="canvas" class="panzoom"></canvas>
      </div>
    </div>
    <div class="controls-hover-container">
      <div class="controls-bar">
        <button
          class="toolbar-button player-button"
          id="cursor-status"
          onclick="changeCursorClickStatus()"
          data-status="player"
        >
          👁️
        </button>
        <button
          class="toolbar-button center-button"
          onclick="handleCenterButtonClick()"
        >
          🎯 Ir al Centro
        </button>
      </div>
    </div>
    <div class="chip-status">
      <div id="chip-color" class="circle-status"></div>
      <label id="chip-label" class="chip-status-text"
        >Modo Ocultar/Mostrar Mapa</label
      >
    </div>
    <script src="./panzoom.js"></script>
    <script src="https://rawgit.com/kawanet/msgpack-lite/master/dist/msgpack.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="./script-admin.js"></script>
  </body>
</html>
