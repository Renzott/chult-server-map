<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas Hexagons</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: lightgrey;
        overflow: hidden;
        min-height: 100%;
        font-family: "Roboto", sans-serif;
      }

      .wrap {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: black;
        overflow: hidden;
      }

      #canvas,
      #cursorCanvas {
        position: absolute;
      }

      #canvas {
        z-index: 1;
        border: 1px solid black;
        background-color: transparent;
      }

      #cursorCanvas {
        z-index: 100;
      }

      .fullscreen-container {
        position: fixed;
        display: flex;
        justify-content: center;
        align-items: center;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 1);
        z-index: 10000;
        transition: opacity 0.5s;
      }

      .loading {
        width: 100px;
        height: 100px;
        border: 16px solid #f3f3f3;
        border-top: 16px solid #3498db;
        border-radius: 50%;
        animation: spin 2s linear infinite;
      }

      .controls-container {
        position: fixed;
        display: flex;
        justify-content: start;
        align-items: start;
        top: 10px;
        left: 10px;
        gap: 10px;
        z-index: 1000;
      }

      .button {
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        padding: 10px;
        opacity: 0.2;
        transition: opacity 0.3s;
        z-index: 2000;
      }

      .player-button {
        background-color: #fb9119;
      }

      .master-button {
        background-color: #0f8602;
      }

      .button:hover {
        opacity: 1;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <link rel="icon" href="./favicon.svg" sizes="any" type="image/svg+xml" />
  </head>
  <body>
    <div class="container">
      <div class="wrap">
        <div class="fullscreen-container">
          <div class="loading"></div>
        </div>
        <canvas id="cursorCanvas" class="panzoom2"></canvas>
        <canvas id="canvas" class="panzoom"></canvas>
      </div>
    </div>
    <div class="controls-container">
      <button class="button" onclick="handleCenterButtonClick()">
        Ir al Centro
      </button>
      <button id="cursor-status" class="button player-button" onclick="changeCursorClickStatus()" data-status="player">
        Cambiar a Ficha Jugador
      </button>
    </div>
    <script src="./panzoom.js"></script>
    <script src="https://rawgit.com/kawanet/msgpack-lite/master/dist/msgpack.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="./script.js"></script>
  </body>
</html>
